:root {
  --mud-bg: #0f0f0f;
  --mud-accent: #4ade80;
  --street-bg: #0a0a2a;
  --street-accent: #3b82f6;
  --startup-bg: #0f172a;
  --startup-accent: #fbbf24;
}

/* Tier Global Styles */
.mud-tier {
  background: linear-gradient(to bottom, #050505, #0a1205);
  font-family: 'Courier New', Courier, monospace;
  position: relative;
  color: #4ade80;
}
.mud-tier::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  background-size: 100% 3px, 2px 100%;
  pointer-events: none;
  z-index: 100;
}

.street-tier {
  background: linear-gradient(to bottom, #0a0a2e, #1e0a3d);
  font-family: 'Inter', sans-serif;
  color: #e879f9;
}
.street-tier * {
  text-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
}

.startup-tier {
  background: #0f172a;
  font-family: 'Geist', 'Inter', sans-serif;
  color: #f8fafc;
}

.corporate-tier {
  background: #000;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fbbf24;
}

.elite-tier {
  background: linear-gradient(to bottom, #1a0f2e, #0a0a0a);
  font-family: 'Georgia', serif;
  color: #d8b4fe;
}

.mogul-tier {
  background: linear-gradient(to bottom, #111, #000);
  font-family: 'Garamond', serif;
  color: #e2e8f0;
}

.president-tier {
  background: #020617;
  font-family: 'Times New Roman', Times, serif;
  color: #f1f5f9;
}

.open-tier {
  background: linear-gradient(to bottom, #fb923c, #f43f5e);
  font-family: 'System-ui', sans-serif;
  color: #fff;
}

/* Tier Specific Card Styles */
.hustle-card-mud {
  --tw-border-opacity: 1;
  border-color: rgb(39 39 42 / var(--tw-border-opacity, 1));
  --tw-bg-opacity: 1;
  background-color: rgb(24 24 27 / var(--tw-bg-opacity, 1));
  --tw-contrast: contrast(1.25);
  --tw-grayscale: grayscale(0.5);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.hustle-card-street {
  border-color: rgb(59 130 246 / 0.3);
  --tw-bg-opacity: 1;
  background-color: rgb(15 23 42 / var(--tw-bg-opacity, 1));
  box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
}
.hustle-card-street:hover {
  --tw-border-opacity: 1;
  border-color: rgb(96 165 250 / var(--tw-border-opacity, 1));
  box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
}

.hustle-card-startup {
  border-color: rgb(255 255 255 / 0.1);
  background-color: rgb(255 255 255 / 0.05);
  --tw-backdrop-blur: blur(12px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.hustle-card-corporate {
  border-color: rgb(234 179 8 / 0.5);
  --tw-bg-opacity: 1;
  background-color: rgb(30 41 59 / var(--tw-bg-opacity, 1));
  background-image: linear-gradient(45deg, rgba(234, 179, 8, 0.05) 25%, transparent 25%);
  background-size: 4px 4px;
}

.hustle-card-elite {
  border-color: rgb(168 85 247 / 0.3);
  background-color: rgb(59 7 100 / 0.4);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.hustle-card-mogul {
  border-color: rgb(217 70 239 / 0.4);
  background-color: rgb(74 4 78 / 0.3);
  border-width: 2px;
}

.hustle-card-president {
  border-color: rgb(217 119 6 / 0.5);
  --tw-bg-opacity: 1;
  background-color: rgb(28 25 23 / var(--tw-bg-opacity, 1));
  box-shadow: 0 0 40px rgba(217, 119, 6, 0.1);
}

.hustle-card-open {
  border-color: rgb(255 255 255 / 0.2);
  --tw-bg-opacity: 1;
  background-color: rgb(0 0 0 / var(--tw-bg-opacity, 1));
  animation: pulse-border 4s infinite;
}

@keyframes pulse-border {
  0%, 100% { border-color: rgba(255,255,255,0.1); }
  50% { border-color: rgba(255,255,255,0.5); }
}

/* Animations */
@keyframes flash-red {
  0%, 100% { color: inherit; }
  50% { color: #ef4444; }
}
@keyframes flash-blue {
  0%, 100% { color: inherit; }
  50% { color: #3b82f6; }
}
@keyframes flash-purple {
  0%, 100% { color: inherit; }
  50% { color: #a855f7; }
}
@keyframes flash-orange {
  0%, 100% { color: inherit; }
  50% { color: #f97316; }
}
@keyframes flash-red-border {
  0%, 100% { border-color: transparent; }
  50% { border-color: #ef4444; }
}

.flash-red { animation: flash-red 1s infinite; }
.flash-blue { animation: flash-blue 1s infinite; }
.flash-purple { animation: flash-purple 1s infinite; }
.flash-orange { animation: flash-orange 1s infinite; }
.flash-red-border { animation: flash-red-border 1s infinite; border-width: 2px; }

/* Performance optimizations */
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

img, video, canvas {
  max-width: 100%;
  height: auto;
}

/* Reduce motion for accessibility */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
