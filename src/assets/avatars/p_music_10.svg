<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_p_music_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <clipPath id="circle_clip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Outer Circle Frame with Circular Crop Grid Accent -->
  <g clip-path="url(#circle_clip)">
    <!-- Background Gradient -->
    <rect x="0" y="0" width="200" height="200" fill="url(#grad_p_music_10)" />
    <circle cx="100" cy="100" r="110" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />
    <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.05" />

    <!-- Character Elements -->

      <!-- Classic Short Hair -->
      <path d="M 58,68 C 58,35 142,35 142,68 C 146,80 144,90 142,92 C 120,95 80,95 58,92 C 56,90 54,80 58,68 Z" fill="#b22222" />


    <!-- Neck -->
    <path d="M 82,120 L 118,120 L 114,155 L 86,155 Z" fill="#d2b48c" opacity="0.9" />
    <path d="M 82,120 L 98,155 L 86,155 Z" fill="#000000" opacity="0.12" />

    <!-- Face Shape -->
    <ellipse cx="100" cy="90" rx="42" ry="48" fill="#d2b48c" />

    <!-- Soft Face Shadow on Left Side (Realistic illumination) -->
    <path d="M 100,42 C 76.8,42 58,63.5 58,90 C 58,116.5 76.8,138 100,138 Z" fill="#000000" opacity="0.06" />

    <!-- Nose -->
    <path d="M 100,82 L 97,102 L 103,102 Z" fill="#d2b48c" filter="brightness(0.88)" />

    <!-- Eyes (Consistent framing & direction) -->
    <g fill="#1f2937">
      <ellipse cx="84" cy="85" rx="5" ry="3.5" />
      <ellipse cx="116" cy="85" rx="5" ry="3.5" />
    </g>
    <!-- Pupils Highlights -->
    <circle cx="85.5" cy="83.5" r="1.2" fill="#ffffff" />
    <circle cx="117.5" cy="83.5" r="1.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 75,77 Q 84,72 91,79" fill="none" stroke="#b22222" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125,77 Q 116,72 109,79" fill="none" stroke="#b22222" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mouth / Smile -->
    <path d="M 88,112 Q 100,124 112,112" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" opacity="0.8" />


      <!-- Hoodie -->
      <path d="M 40,150 L 160,150 L 175,200 L 25,200 Z" fill="#4a0e4e" />
      <!-- Hood outline -->
      <path d="M 64,130 C 64,130 100,155 136,130 C 150,150 152,190 152,190 L 48,190 C 48,190 50,150 64,130 Z" fill="#4a0e4e" opacity="0.9" stroke="#ffffff10" />
      <!-- Drawstrings -->
      <line x1="88" y1="155" x2="88" y2="185" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round" />
      <line x1="112" y1="155" x2="112" y2="185" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round" />


      <!-- Headphones -->
      <path d="M 52,70 C 52,30 148,30 148,70" stroke="#1f2937" stroke-width="8" stroke-linecap="round" fill="none" />
      <rect x="42" y="65" width="14" height="26" fill="#111827" rx="6" />
      <rect x="144" y="65" width="14" height="26" fill="#111827" rx="6" />
      <rect x="44" y="69" width="10" height="18" fill="#a855f7" rx="4" />
      <rect x="146" y="69" width="10" height="18" fill="#a855f7" rx="4" />

  </g>

  <!-- Circular Border Highlight -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.15" />
</svg>