<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_p_elite_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <clipPath id="circle_clip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Outer Circle Frame with Circular Crop Grid Accent -->
  <g clip-path="url(#circle_clip)">
    <!-- Background Gradient -->
    <rect x="0" y="0" width="200" height="200" fill="url(#grad_p_elite_6)" />
    <circle cx="100" cy="100" r="110" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />
    <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.05" />

    <!-- Character Elements -->

      <!-- Bob Hair -->
      <path d="M 55,70 C 55,30 145,30 145,70 C 150,95 145,115 142,120 L 134,120 C 138,105 138,80 138,75 L 62,75 C 62,80 62,105 66,120 L 58,120 C 55,115 50,95 55,70 Z" fill="#0d0d0d" />


    <!-- Neck -->
    <path d="M 82,120 L 118,120 L 114,155 L 86,155 Z" fill="#ffdbac" opacity="0.9" />
    <path d="M 82,120 L 98,155 L 86,155 Z" fill="#000000" opacity="0.12" />

    <!-- Face Shape -->
    <ellipse cx="100" cy="90" rx="42" ry="48" fill="#ffdbac" />

    <!-- Soft Face Shadow on Left Side (Realistic illumination) -->
    <path d="M 100,42 C 76.8,42 58,63.5 58,90 C 58,116.5 76.8,138 100,138 Z" fill="#000000" opacity="0.06" />

    <!-- Nose -->
    <path d="M 100,82 L 97,102 L 103,102 Z" fill="#ffdbac" filter="brightness(0.88)" />

    <!-- Eyes (Consistent framing & direction) -->
    <g fill="#1f2937">
      <ellipse cx="84" cy="85" rx="5" ry="3.5" />
      <ellipse cx="116" cy="85" rx="5" ry="3.5" />
    </g>
    <!-- Pupils Highlights -->
    <circle cx="85.5" cy="83.5" r="1.2" fill="#ffffff" />
    <circle cx="117.5" cy="83.5" r="1.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 75,77 Q 84,72 91,79" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125,77 Q 116,72 109,79" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mouth / Smile -->
    <path d="M 88,112 Q 100,124 112,112" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" opacity="0.8" />


      <!-- Formal Shirt -->
      <path d="M 40,150 L 160,150 L 175,200 L 25,200 Z" fill="#d4af37" />
      <!-- Collar -->
      <path d="M 74,150 L 100,165 L 126,150 L 114,136 L 86,136 Z" fill="#ffffff" stroke="#00000010" />
      <!-- Buttons -->
      <circle cx="100" cy="172" r="2.5" fill="#e5e5e5" />
      <circle cx="100" cy="188" r="2.5" fill="#e5e5e5" />


  </g>

  <!-- Circular Border Highlight -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.15" />
</svg>