<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_p_corporate_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <clipPath id="circle_clip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Outer Circle Frame with Circular Crop Grid Accent -->
  <g clip-path="url(#circle_clip)">
    <!-- Background Gradient -->
    <rect x="0" y="0" width="200" height="200" fill="url(#grad_p_corporate_5)" />
    <circle cx="100" cy="100" r="110" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />
    <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.05" />

    <!-- Character Elements -->

      <!-- Dreads Hair -->
      <path d="M 55,70 C 55,35 145,35 145,70" stroke="#1a0a00" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 50,60 L 38,110" stroke="#1a0a00" stroke-width="8" stroke-linecap="round" />
      <path d="M 62,55 L 48,115" stroke="#1a0a00" stroke-width="8" stroke-linecap="round" />
      <path d="M 150,60 L 162,110" stroke="#1a0a00" stroke-width="8" stroke-linecap="round" />
      <path d="M 138,55 L 152,115" stroke="#1a0a00" stroke-width="8" stroke-linecap="round" />
      <path d="M 100,38 L 100,120" stroke="#1a0a00" stroke-width="6" stroke-linecap="round" opacity="0.8" />


    <!-- Neck -->
    <path d="M 82,120 L 118,120 L 114,155 L 86,155 Z" fill="#c68642" opacity="0.9" />
    <path d="M 82,120 L 98,155 L 86,155 Z" fill="#000000" opacity="0.12" />

    <!-- Face Shape -->
    <ellipse cx="100" cy="90" rx="42" ry="48" fill="#c68642" />

    <!-- Soft Face Shadow on Left Side (Realistic illumination) -->
    <path d="M 100,42 C 76.8,42 58,63.5 58,90 C 58,116.5 76.8,138 100,138 Z" fill="#000000" opacity="0.06" />

    <!-- Nose -->
    <path d="M 100,82 L 97,102 L 103,102 Z" fill="#c68642" filter="brightness(0.88)" />

    <!-- Eyes (Consistent framing & direction) -->
    <g fill="#1f2937">
      <ellipse cx="84" cy="85" rx="5" ry="3.5" />
      <ellipse cx="116" cy="85" rx="5" ry="3.5" />
    </g>
    <!-- Pupils Highlights -->
    <circle cx="85.5" cy="83.5" r="1.2" fill="#ffffff" />
    <circle cx="117.5" cy="83.5" r="1.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 75,77 Q 84,72 91,79" fill="none" stroke="#1a0a00" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125,77 Q 116,72 109,79" fill="none" stroke="#1a0a00" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mouth / Smile -->
    <path d="M 88,112 Q 100,124 112,112" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" opacity="0.8" />


      <!-- Hoodie -->
      <path d="M 40,150 L 160,150 L 175,200 L 25,200 Z" fill="#6b4226" />
      <!-- Hood outline -->
      <path d="M 64,130 C 64,130 100,155 136,130 C 150,150 152,190 152,190 L 48,190 C 48,190 50,150 64,130 Z" fill="#6b4226" opacity="0.9" stroke="#ffffff10" />
      <!-- Drawstrings -->
      <line x1="88" y1="155" x2="88" y2="185" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round" />
      <line x1="112" y1="155" x2="112" y2="185" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round" />


      <!-- Modern Smart Glasses -->
      <g stroke="#94a3b8" stroke-width="3" fill="none" opacity="0.9">
        <circle cx="82" cy="85" r="14" />
        <circle cx="118" cy="85" r="14" />
        <line x1="96" y1="85" x2="104" y2="85" />
        <line x1="68" y1="82" x2="74" y2="82" />
        <line x1="126" y1="82" x2="132" y2="82" />
      </g>

  </g>

  <!-- Circular Border Highlight -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ffffff" stroke-width="4.5" opacity="0.15" />
</svg>